<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
<title id="title">Temps de parcours dirigés : semi-groupe, première arrivée et projection en 2D</title>
<desc id="desc">Schéma pédagogique des propriétés du flot autonome, du temps dirigé sur une orbite circulaire, du contre-exemple sans unicité et de la projection V2 en deux dimensions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#21834a"/></marker><marker id="redarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c43d3d"/></marker></defs>
<rect width="1440" height="940" fill="#f7fafc"/>
<text x="48" y="55" font-family="sans-serif" font-size="30" font-weight="700" fill="#14532d">J-DriftX — Comprendre les temps de parcours dirigés</text>
<text x="48" y="85" font-family="sans-serif" font-size="16" fill="#40576b">Les schémas illustrent les hypothèses du glossaire ; ils ne remplacent ni les preuves ni les tests.</text>
<!-- panel 1 -->
<rect x="35" y="115" width="670" height="330" rx="14" fill="white" stroke="#9ac8a8" stroke-width="2"/>
<text x="60" y="151" font-family="sans-serif" font-size="22" font-weight="700" fill="#21834a">1. Semi-groupe ⇒ inégalité triangulaire (V1)</text>
<text x="60" y="184" font-family="serif" font-size="19" fill="#17324d">X(s+t; A) = X(t; X(s; A))</text>
<line x1="90" y1="248" x2="645" y2="248" stroke="#647b8e" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="110" cy="248" r="7" fill="#21834a"/><circle cx="350" cy="248" r="7" fill="#2f9e44"/><circle cx="620" cy="248" r="7" fill="#c43d3d"/>
<text x="101" y="274" font-family="sans-serif" font-size="17" fill="#17324d">A</text><text x="342" y="274" font-family="sans-serif" font-size="17" fill="#17324d">B</text><text x="613" y="274" font-family="sans-serif" font-size="17" fill="#17324d">C</text>
<line x1="122" y1="219" x2="337" y2="219" stroke="#21834a" stroke-width="2" marker-end="url(#arrow)"/><line x1="362" y1="219" x2="607" y2="219" stroke="#21834a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="220" y="209" font-family="serif" font-size="18" fill="#21834a">s</text><text x="480" y="209" font-family="serif" font-size="18" fill="#21834a">t</text>
<text x="70" y="320" font-family="serif" font-size="23" fill="#17324d">T(A,C) ≤ T(A,B) + T(B,C)</text>
<text x="70" y="357" font-family="sans-serif" font-size="15" fill="#40576b">Hypothèses : champ autonome, solution unique, existence aux temps utilisés.</text>
<text x="70" y="382" font-family="sans-serif" font-size="15" fill="#40576b">Sans unicité, X(t;A) peut être ambigu : la preuve ne s'applique pas telle quelle.</text>
<!-- panel 2 -->
<rect x="730" y="115" width="675" height="330" rx="14" fill="white" stroke="#9ac8a8" stroke-width="2"/>
<text x="755" y="151" font-family="sans-serif" font-size="22" font-weight="700" fill="#21834a">2. Orbite circulaire : le temps est dirigé</text>
<circle cx="990" cy="280" r="105" fill="none" stroke="#21834a" stroke-width="3"/>
<line x1="865" y1="280" x2="1115" y2="280" stroke="#9aabb8" stroke-width="1.5"/><line x1="990" y1="155" x2="990" y2="405" stroke="#9aabb8" stroke-width="1.5"/>
<path d="M 1095 280 A 105 105 0 0 1 990 175" fill="none" stroke="#21834a" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="1095" cy="280" r="7" fill="#c43d3d"/><circle cx="1042" cy="206" r="7" fill="#2f9e44"/>
<text x="1107" y="286" font-family="sans-serif" font-size="16" fill="#c43d3d">B</text><text x="1048" y="199" font-family="sans-serif" font-size="16" fill="#2f9e44">A</text>
<text x="1160" y="220" font-family="serif" font-size="18" fill="#17324d">ẋ = −y</text><text x="1160" y="248" font-family="serif" font-size="18" fill="#17324d">ẏ = x</text>
<text x="1160" y="290" font-family="sans-serif" font-size="15" fill="#40576b">Période : 2π</text>
<text x="1160" y="315" font-family="sans-serif" font-size="15" fill="#40576b">T(A,B) + T(B,A) = 2π</text>
<text x="1160" y="340" font-family="sans-serif" font-size="15" fill="#40576b">A et B distincts</text>
<text x="755" y="405" font-family="sans-serif" font-size="15" fill="#40576b">Sur une orbite de période minimale 2π : T(A,B) + T(B,A) = 2π pour deux points distincts.</text>
<!-- panel 3 -->
<rect x="35" y="470" width="670" height="300" rx="14" fill="white" stroke="#9ac8a8" stroke-width="2"/>
<text x="60" y="507" font-family="sans-serif" font-size="22" font-weight="700" fill="#21834a">3. Continuité sans unicité</text>
<text x="60" y="542" font-family="serif" font-size="19" fill="#17324d">ẋ = √x, x(0)=0</text>
<line x1="95" y1="690" x2="650" y2="690" stroke="#647b8e" stroke-width="1.5"/><line x1="110" y1="710" x2="110" y2="575" stroke="#647b8e" stroke-width="1.5"/>
<path d="M110 690 L635 690" fill="none" stroke="#21834a" stroke-width="3"/>
<path d="M110 690 Q180 690 230 660 T360 610 T520 570" fill="none" stroke="#2f9e44" stroke-width="3"/>
<path d="M110 690 L240 690 Q300 690 350 660 T520 590" fill="none" stroke="#c43d3d" stroke-width="3" stroke-dasharray="8 5"/>
<text x="400" y="720" font-family="sans-serif" font-size="14" fill="#21834a">solution stationnaire</text><text x="360" y="585" font-family="sans-serif" font-size="14" fill="#2f9e44">départ immédiat</text><text x="365" y="650" font-family="sans-serif" font-size="14" fill="#c43d3d">départ après délai</text>
<text x="60" y="746" font-family="sans-serif" font-size="15" fill="#40576b">Plusieurs solutions : l'intégrale d'une branche mobile ne sélectionne pas un flot unique.</text>
<!-- panel 4 -->
<rect x="730" y="470" width="675" height="300" rx="14" fill="white" stroke="#9ac8a8" stroke-width="2"/>
<text x="755" y="507" font-family="sans-serif" font-size="22" font-weight="700" fill="#21834a">4. Projection : perte de séparation en 2D</text>
<text x="770" y="545" font-family="sans-serif" font-size="17" font-weight="700" fill="#21834a">Champ u = (1,0) : les caractéristiques sont horizontales</text>
<line x1="790" y1="600" x2="1350" y2="600" stroke="#21834a" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="790" y1="680" x2="1350" y2="680" stroke="#21834a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="795" y="590" font-family="sans-serif" font-size="14" fill="#40576b">y = 1</text>
<text x="795" y="670" font-family="sans-serif" font-size="14" fill="#40576b">y = −1</text>
<line x1="1110" y1="612" x2="1110" y2="668" stroke="#c43d3d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#redarrow)"/>
<circle cx="1110" cy="600" r="7" fill="#21834a"/>
<circle cx="1110" cy="680" r="7" fill="#c43d3d"/>
<text x="1125" y="595" font-family="sans-serif" font-size="16" fill="#21834a">B = (2,1)</text>
<text x="1125" y="702" font-family="sans-serif" font-size="16" fill="#c43d3d">C = (2,−1)</text>
<text x="755" y="730" font-family="sans-serif" font-size="15" fill="#40576b">La projection de C sur la caractéristique y=1 passant par B est B.</text>
<text x="755" y="752" font-family="sans-serif" font-size="15" font-weight="700" fill="#14532d">Donc V2(B,C)=0 malgré B ≠ C : la séparation échoue.</text>
<rect x="35" y="795" width="1370" height="105" rx="12" fill="#eaf6ec" stroke="#9ac8a8" stroke-width="1.5"/>
<text x="60" y="831" font-family="sans-serif" font-size="19" font-weight="700" fill="#21834a">À retenir</text>
<text x="60" y="860" font-family="sans-serif" font-size="16" fill="#17324d">Exemples illustratifs, non preuves. V1/V2 gardent leurs hypothèses ; aucun solveur général de champ variable n’est revendiqué.</text>
</svg>
