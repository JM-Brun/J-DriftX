# Graphe de connaissances J-DriftX : source de vérité unique.
#
# Ce registre décrit les nœuds typés du projet (concepts, hypothèses H1-H8,
# niveaux N0-N6, propriétés, modules, tests, références bibliographiques,
# jeux de données) et les arêtes typées qui les relient. Le rendu Mermaid
# (site/projet/_graphes-mermaid.md) est généré depuis ce fichier par
# `uv run python -m jdriftx.graphe_connaissances` et inclus dans la page
# « Carte des connaissances » du site Quarto.
#
# Règles vérifiées par src/jdriftx.graphe_connaissances.py (et la CI) :
#   - chaque relation porte un type sémantique parmi SUPPORTED_BY, VALIDATED_BY,
#     TESTED_BY, LIMITED_BY ou structurelle ; toute arête non structurelle
#     porte une justification vérifiable (document, référence, code ou test) ;
#   - identifiants uniques ; types et relations dans les listes ci-dessous ;
#   - chaque nœud apparaît dans au moins une vue ; chaque arête est rendue
#     dans au moins une vue (ses deux extrémités y sont) ;
#   - chaque lien pointe vers un fichier réel du dépôt ou une URL absolue ;
#   - chaque clé de site/references.bib a un nœud reference, et réciproquement ;
#   - chaque module de src/jdriftx (hors __init__.py) a un nœud module, et
#     réciproquement.
#
# Toute modification doit être suivie d'une régénération du rendu et d'un
# commit des deux fichiers ensemble : le test de synchronisation
# (tests/test_graphe_connaissances.py) échoue sinon.

# ---------- Types de nœuds (une couleur par type) ----------

[types.hypothese]
libelle = "Hypothèse"
couleur = "#bfe0ff"

[types.niveau]
libelle = "Niveau de modélisation"
couleur = "#ddd0f0"

[types.concept]
libelle = "Concept"
couleur = "#c9ecd9"

[types.propriete]
libelle = "Propriété (visée ou testée)"
couleur = "#ffd9b3"

[types.module]
libelle = "Module de code"
couleur = "#d7f0a1"

[types.test]
libelle = "Test (CI)"
couleur = "#e9ecef"

[types.donnees]
libelle = "Jeu de données candidat"
couleur = "#fff1a6"

[types.reference]
libelle = "Référence bibliographique"
couleur = "#e6dccb"

# ---------- Relations (fermé : toute arête doit en utiliser une) ----------

[relations.sapplique-a]
signification = "l’hypothèse contraint le niveau visé dans la démarche de modélisation"
ne_affirme_pas = "que l’hypothèse soit implémentée ou testée à ce niveau"
type_semantique = "structurelle"
libelle = "s'applique à"

[relations.traduite-en]
signification = "l’hypothèse donne naissance à l’objet mathématique visé dans la modélisation"
ne_affirme_pas = "que cet objet soit implémenté ou testé"
type_semantique = "structurelle"
libelle = "traduite en"

[relations.fonde]
signification = "la source primaire identifiée fonde l’objet visé (définition, construction ou propriété)"
ne_affirme_pas = "une validation expérimentale de l’objet par cette seule source"
type_semantique = "SUPPORTED_BY"
libelle = "fonde"

[relations.depend-de]
signification = "l’objet d’origine suppose l’objet ciblé pour être défini"
ne_affirme_pas = "une relation de preuve entre les deux objets"
type_semantique = "structurelle"
libelle = "dépend de"

[relations.alimente]
signification = "enchaînement de lecture du niveau amont vers le niveau aval"
ne_affirme_pas = "un enchaînement implémenté ou testé"
type_semantique = "structurelle"
libelle = "alimente"

[relations.construit]
signification = "l’objet d’origine participe à la construction de l’objet ciblé"
ne_affirme_pas = "que cette construction soit implémentée dans le code actuel"
type_semantique = "structurelle"
libelle = "construit"

[relations.implemente-par]
signification = "le module cité implémente l’objet mathématique, selon le contrat vérifiable du code source"
ne_affirme_pas = "l’exactitude de l’implémentation au-delà des tests nommés"
type_semantique = "SUPPORTED_BY"
libelle = "implémenté par"

[relations.teste]
signification = "le module exécute des vérifications ciblées de la propriété, dans la portée des tests correspondants"
ne_affirme_pas = "une preuve universelle de la propriété ou une validité physique"
type_semantique = "TESTED_BY"
libelle = "teste"

[relations.teste-par]
signification = "le fichier de test vérifie la propriété dans une portée explicitée sur la carte des preuves"
ne_affirme_pas = "une preuve universelle de la propriété ou une validité physique"
type_semantique = "TESTED_BY"
libelle = "testée par"

[relations.couvre]
signification = "le fichier de test exerce les fonctions du module ciblé"
ne_affirme_pas = "une validité physique du module ou une couverture exhaustive"
type_semantique = "TESTED_BY"
libelle = "couvre"

[relations.utilise]
signification = "le module ou l’objet d’origine utilise l’objet ciblé"
ne_affirme_pas = "une relation de preuve"
type_semantique = "structurelle"
libelle = "utilise"

[relations.decrit]
signification = "la référence documente l’objet visé, sans nécessairement le fonder"
ne_affirme_pas = "un appui direct des affirmations du projet"
type_semantique = "SUPPORTED_BY"
libelle = "décrit"

[relations.candidat-pour]
signification = "le jeu de données est candidat pour contraindre le niveau visé, sous réserve des licences et des observables"
ne_affirme_pas = "une validation par ce seul jeu de données"
type_semantique = "structurelle"
libelle = "candidat pour"

[relations.contexte]
signification = "la référence ou le module fournit un arrière-plan documentaire à l’objet visé"
ne_affirme_pas = "tout appui, fondement ou validation"
type_semantique = "structurelle"
libelle = "contexte"

[relations.non-couvert-par]
signification = "l’objet d’origine est explicitement soumis à la limite connue portée par la cible"
ne_affirme_pas = "que cette limite soit levée ailleurs dans le projet"
type_semantique = "LIMITED_BY"
libelle = "non couvert par"

