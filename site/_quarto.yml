              - href: projet/carte-connaissances.qmd
                text: "Graphe des connaissances traçables"
              - href: projet/modele-jouet.qmd
                text: "Modèle jouet : repli théorique"
              - href: references.qmd
                text: "Références bibliographiques"

format:
  html:
    theme:
      light: [cosmo, styles.scss, palette-light.scss]
      dark: [dark, styles.scss, palette-dark.scss]
    lang: fr
    toc: true
    toc-depth: 3
    toc-expand: false
    html-math-method: katex
    link-external-newwindow: true
    grid:
      sidebar-width: 280px
    bibliography: references.bib
