project:
  type: website
  output-dir: _site
  resources:
    - visuels-g0s/glossaire-g0s.svg

website:
  title: "J-DriftX"
  site-url: "https://jm-brun.github.io/J-DriftX/"
  description: "Dispersion atmosphérique à complexité réduite : reprise open-source du projet Drift-X"
  repo-url: "https://github.com/JM-Brun/J-DriftX"
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  navbar:
    tools:
      - icon: github
        url: "https://github.com/JM-Brun/J-DriftX"
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: "Accueil"

      - section: "S'orienter"
        contents:
          - href: projet/carte-articulation.qmd
            text: "Parcours de lecture & articulation des preuves"
          - href: glossaire.qmd
            text: "Glossaire des notions"

      - section: "Le projet"
        contents:
          - href: projet/objectifs.qmd
            text: "Question de recherche & objectifs"
          - href: projet/utilite-scientifique.qmd
            text: "Valeur scientifique à démontrer"
          - href: projet/heritage.qmd
            text: "Héritage Drift-X (2006–2009)"

      - section: "Comprendre & explorer"
        contents:
          - href: projet/carte-scientifique.qmd
            text: "Carte scientifique des interactions"
          - href: projet/niveaux-modelisation.qmd
            text: "Chaîne physique et mathématique (N0–N6)"
          - href: projet/laboratoire-interactif.qmd
            text: "Laboratoires : catalogue & limites"
          - href: projet/experiences-interactives.qmd
            text: "Explorateur de champs de vent 2D"

      - section: "Construire la théorie"
        contents:
          - section: "Modèle direct et réduction"
            contents:
              - href: theorie/modele-direct.qmd
                text: "Modèle direct"
              - href: theorie/similitude.qmd
                text: "Solutions de similitude"
              - href: theorie/reduction-a-priori.qmd
                text: "Réduction a priori"
          - section: "Transport et géométrie"
            contents:
              - href: theorie/metrique-travel-time.qmd
                text: "Temps de transport dirigé"
              - href: theorie/metriques-non-riemanniennes.qmd
                text: "Métriques non riemanniennes"
              - href: theorie/navigation-fronts-controllabilite.qmd
                text: "Zermelo, fronts et Hamilton–Jacobi"
          - section: "Contraintes et modèles de référence"
            contents:
              - href: theorie/contraintes-physiques.qmd
                text: "Contraintes physiques"
              - href: theorie/assimilation-identification.qmd
                text: "Assimilation & identification"
              - href: theorie/edp-et-maillage.qmd
                text: "EDP & maillage"
              - href: theorie/comparaison-complexites.qmd
                text: "Comparer les complexités"
              - href: theorie/burgers-et-jdriftx.qmd
                text: "Équation de Burgers et J-DriftX"

      - section: "Vérifier & évaluer"
        contents:
          - href: hypotheses/catalogue.qmd
            text: "Hypothèses du modèle"
          - href: hypotheses/limites.qmd
            text: "Limites & domaines de validité"
          - href: projet/registre-preuves.qmd
            text: "Registre de traçabilité des preuves"
          - href: projet/validation-scientifique.qmd
            text: "Validation scientifique & benchmarks"
          - href: projet/qualite.qmd
            text: "Tests logiciels & portée des vérifications"

      - section: "Comparer & approfondir"
        contents:
          - section: "État de l'art"
            contents:
              - href: etat-art/panorama.qmd
                text: "Panorama des méthodes"
              - href: etat-art/positionnement.qmd
                text: "Positionnement de J-DriftX"
              - href: etat-art/revue-mathematique.qmd
                text: "Revue mathématique ciblée"
          - section: "Sources, données et traçabilité"
