<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#202124">Trois boules unités — du cercle euclidien à la boule non riemannienne</text>
  <text x="30" y="56" font-size="13" fill="#5f6368">La boule unité (points à « distance 1 » de l'origine O) révèle la métrique : cercle, ellipse symétrique, ovale décentré.</text>
  <line x1="300" y1="90" x2="300" y2="400" stroke="#e8eaed" stroke-width="1"/>
  <line x1="600" y1="90" x2="600" y2="400" stroke="#e8eaed" stroke-width="1"/>
  <text x="160" y="110" font-size="16" font-weight="bold" fill="#202124" text-anchor="middle">Euclidien</text>
  <circle cx="160" cy="250" r="85" fill="#4285f4" opacity="0.12" stroke="#4285f4" stroke-width="2"/>
  <circle cx="160" cy="250" r="4" fill="#202124"/>
  <text x="160" y="272" font-size="13" fill="#202124" text-anchor="middle">O</text>
  <text x="160" y="368" font-size="12" fill="#5f6368" text-anchor="middle">d(A,B) = d(B,A), isotrope :</text>
  <text x="160" y="386" font-size="12" fill="#5f6368" text-anchor="middle">la boule unité est un cercle</text>
  <text x="450" y="110" font-size="16" font-weight="bold" fill="#202124" text-anchor="middle">Riemannien</text>
  <ellipse cx="450" cy="250" rx="110" ry="62" fill="#34a853" opacity="0.12" stroke="#34a853" stroke-width="2"/>
  <circle cx="450" cy="250" r="4" fill="#202124"/>
  <text x="450" y="272" font-size="13" fill="#202124" text-anchor="middle">O</text>
  <line x1="340" y1="250" x2="560" y2="250" stroke="#34a853" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="450" y1="188" x2="450" y2="312" stroke="#34a853" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="450" y="368" font-size="12" fill="#5f6368" text-anchor="middle">ds² = g(x) dx dx : anisotrope</text>
  <text x="450" y="386" font-size="12" fill="#5f6368" text-anchor="middle">mais symétrique — même boule dans les deux sens</text>
  <text x="750" y="110" font-size="16" font-weight="bold" fill="#202124" text-anchor="middle">Non riemannien</text>
  <path d="M 690 250 A 85 72 0 0 1 860 250 A 85 42 0 0 1 690 250 Z" fill="#a14200" opacity="0.14" stroke="#a14200" stroke-width="2"/>
  <circle cx="690" cy="250" r="4" fill="#202124"/>
  <text x="690" y="272" font-size="13" fill="#202124" text-anchor="end">O</text>
  <line x1="640" y1="330" x2="700" y2="330" stroke="#4285f4" stroke-width="2" marker-end="url(#fleche-b)"/>
  <defs>
    <marker id="fleche-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4285f4"/>
    </marker>
  </defs>
  <text x="648" y="318" font-size="11" fill="#4285f4">le vent donne un sens</text>
  <text x="750" y="368" font-size="12" fill="#5f6368" text-anchor="middle">quasi-métrique / Finsler : boule décentrée,</text>
  <text x="750" y="386" font-size="12" fill="#5f6368" text-anchor="middle">d(O→P) ≠ d(P→O) — la métrique a un sens</text>
  <text x="870" y="420" font-size="12" fill="#a14200" text-anchor="end" font-style="italic">τ de Drift-X : famille des non-riemanniennes — voir page « Métriques non riemanniennes »</text>
</svg>
