<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Pseudo-distance projetée et contre-exemple à l'inégalité triangulaire</title>
<desc id="desc">Deux panneaux. À gauche, le point B est projeté orthogonalement sur la caractéristique horizontale issue de A et le coût est intégré seulement le long de cette caractéristique. À droite, les projections B⊥ et C⊥ sont identifiées; les trois coûts sont lus sur les caractéristiques horizontales, dans un champ plus rapide à y égal 1.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2367a8"/></marker>
  <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#20252b}
    .panel{fill:#fbfcfe;stroke:#c8d1dc;stroke-width:2}
    .heading{font-size:25px;font-weight:700}
    .label{font-size:20px}
    .small{font-size:17px}
    .blue{stroke:#2367a8;fill:none;stroke-width:4}
    .orange{stroke:#c45b18;fill:none;stroke-width:4}
    .dash{stroke:#687582;stroke-width:2;stroke-dasharray:8 7;fill:none}
  </style>
</defs>
<rect x="18" y="18" width="1164" height="724" rx="18" fill="#ffffff" stroke="#d7dde5"/>
<rect class="panel" x="38" y="38" width="1124" height="316" rx="14"/>
<text class="heading" x="66" y="78">1. Définition projetée dans un champ uniforme</text>
<line x1="105" y1="255" x2="1080" y2="255" stroke="#7c8793" stroke-width="2" marker-end="url(#arrowDark)"/>
<text class="small" x="1010" y="284">direction x</text>
<line class="blue" x1="180" y1="255" x2="820" y2="255" marker-end="url(#arrow)"/>
<text class="label" x="360" y="235" fill="#2367a8">caractéristique de A : u = (U, 0), U &gt; 0</text>
<line class="dash" x1="820" y1="145" x2="820" y2="255"/>
<circle cx="180" cy="255" r="8" fill="#2367a8"/>
<circle cx="820" cy="255" r="8" fill="#2367a8"/>
<circle cx="820" cy="145" r="9" fill="#c45b18"/>
<text class="label" x="151" y="291">A</text>
<text class="label" x="836" y="264">B⊥</text>
<text class="label" x="837" y="150">B</text>
<text class="small" x="850" y="191">projection normale</text>
<text class="small" x="850" y="213">de B sur la trajectoire</text>
<rect x="88" y="103" width="630" height="72" rx="9" fill="#eaf2fb" stroke="#c1d8ef"/>
<text class="label" x="108" y="132">Le coût historique est le temps de A à B⊥,</text>
<text class="label" x="108" y="157">pas un temps de déplacement transversal jusqu'à B.</text>
<text class="small" x="90" y="326">Conséquence : si B et A ont la même coordonnée longitudinale, le coût peut être nul même si B ≠ A.</text>
<rect class="panel" x="38" y="374" width="1124" height="342" rx="14"/>
<text class="heading" x="66" y="414">2. Pourquoi l'inégalité triangulaire peut échouer</text>
<text class="small" x="70" y="445">Champ stationnaire u(x,y) = (1 + 9y, 0), avec coordonnées adimensionnées et 0 ≤ y ≤ 1.</text>
<line x1="130" y1="640" x2="720" y2="640" stroke="#687582" stroke-width="2" marker-end="url(#arrowDark)"/>
<line x1="130" y1="640" x2="130" y2="475" stroke="#687582" stroke-width="2" marker-end="url(#arrowDark)"/>
<text class="small" x="698" y="665">x</text><text class="small" x="106" y="481">y</text>
<line class="blue" x1="170" y1="620" x2="675" y2="620" marker-end="url(#arrow)"/>
<line class="blue" x1="422" y1="500" x2="675" y2="500" marker-end="url(#arrow)"/>

<line class="dash" x1="422" y1="500" x2="422" y2="620"/>
<line class="dash" x1="675" y1="500" x2="675" y2="620"/>
<circle cx="170" cy="620" r="8" fill="#2367a8"/><circle cx="422" cy="500" r="8" fill="#c45b18"/><circle cx="422" cy="620" r="7" fill="#ffffff" stroke="#c45b18" stroke-width="3"/><circle cx="675" cy="500" r="7" fill="#ffffff" stroke="#c45b18" stroke-width="3"/><circle cx="675" cy="620" r="8" fill="#2367a8"/>
<text class="label" x="145" y="610">A (0,0)</text><text class="label" x="435" y="490">B (1,1)</text><text class="small" x="430" y="658">B⊥ (1,0)</text><text class="small" x="684" y="490">C⊥ (2,1)</text><text class="label" x="633" y="610">C (2,0)</text>
<text class="small" x="195" y="600">vitesse = 1</text><text class="small" x="465" y="480">vitesse = 10</text>
<text class="small" x="245" y="690">d(A,C) = 2</text><text class="small" x="445" y="690">d(A,B) = 1</text><text class="small" x="625" y="690">d(B,C) = 0,1</text>
<rect x="770" y="472" width="350" height="190" rx="12" fill="#fff4e9" stroke="#e7bd96" stroke-width="2"/>
<text class="label" x="792" y="508">Comparaison</text>
<text class="label" x="792" y="545">d(A,C) = 2</text>
<text class="label" x="792" y="579">d(A,B) + d(B,C) = 1,1</text>
<line x1="792" y1="596" x2="1090" y2="596" stroke="#c45b18" stroke-width="2"/>
<text class="label" x="792" y="628">2 &gt; 1,1</text>
<text class="small" x="792" y="649">La triangulation échoue.</text>
</svg>