<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fleche-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#202124">J-DriftX — du rang de vigne au bassin versant</text>
  <text x="30" y="56" font-size="13" fill="#5f6368">Champ proche et champ lointain couplés par la même métrique τ ; multi-niveaux emboîtés, évaluation ponctuelle, couche SIG.</text>
  <rect x="30" y="80" width="270" height="270" fill="#f8faf9" stroke="#dadce0" rx="8"/>
  <text x="165" y="104" font-size="15" font-weight="bold" fill="#188038" text-anchor="middle">Champ proche — parcelle (1 ha)</text>
  <line x1="50" y1="290" x2="280" y2="290" stroke="#9aa0a6" stroke-width="2"/>
  <g fill="#34a853">
    <rect x="70" y="264" width="8" height="26" rx="2"/>
    <rect x="100" y="264" width="8" height="26" rx="2"/>
    <rect x="130" y="264" width="8" height="26" rx="2"/>
    <rect x="160" y="264" width="8" height="26" rx="2"/>
    <rect x="190" y="264" width="8" height="26" rx="2"/>
    <rect x="220" y="264" width="8" height="26" rx="2"/>
    <rect x="250" y="264" width="8" height="26" rx="2"/>
  </g>
  <text x="160" y="256" font-size="11" fill="#5f6368" text-anchor="middle">rangs espacés de 1,5 m</text>
  <circle cx="90" cy="238" r="5" fill="#202124"/>
  <path d="M 96 238 Q 150 226 210 232 Q 250 240 278 252" stroke="#a14200" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
  <text x="96" y="222" font-size="11" fill="#202124">buse (10 cm)</text>
  <text x="165" y="330" font-size="12" fill="#5f6368" text-anchor="middle">émission + distribution immédiate :</text>
  <text x="165" y="348" font-size="12" fill="#5f6368" text-anchor="middle">conditions d'entrée du transport</text>
  <rect x="330" y="80" width="280" height="270" fill="#f8f9fa" stroke="#dadce0" rx="8"/>
  <text x="470" y="104" font-size="15" font-weight="bold" fill="#1a73e8" text-anchor="middle">Champ lointain — bassin (400 km²)</text>
  <path d="M 340 330 L 440 310 L 520 322 L 610 316 L 600 330 Z" fill="#e8f0e9" stroke="#9aa0a6"/>
  <path d="M 370 300 Q 470 268 560 276 Q 600 284 606 296" stroke="#4285f4" stroke-width="3" fill="none"/>
  <path d="M 380 300 Q 470 280 556 288" stroke="#4285f4" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="368" cy="300" r="6" fill="#202124"/>
  <text x="368" y="282" font-size="11" fill="#202124" text-anchor="middle">source</text>
  <g fill="#f9ab00" opacity="0.5">
    <ellipse cx="500" cy="306" rx="34" ry="7"/>
    <ellipse cx="560" cy="308" rx="28" ry="6"/>
    <ellipse cx="440" cy="304" rx="26" ry="6"/>
  </g>
  <text x="470" y="348" font-size="12" fill="#5f6368" text-anchor="middle">panache, iso-τ, dépôts (~10 kg/km²)</text>
  <line x1="300" y1="215" x2="330" y2="215" stroke="#5f6368" stroke-width="2" marker-end="url(#fleche-p)"/>
  <text x="315" y="205" font-size="11" fill="#5f6368" text-anchor="middle">τ</text>
  <rect x="640" y="80" width="230" height="270" fill="#fef7f0" stroke="#dadce0" rx="8"/>
  <text x="755" y="104" font-size="15" font-weight="bold" fill="#a14200" text-anchor="middle">Multi-niveaux emboîtés</text>
  <rect x="665" y="125" width="180" height="120" fill="#ffffff" stroke="#a14200" stroke-width="2"/>
  <text x="678" y="141" font-size="11" fill="#a14200">N3 : ~10 km² (bassin)</text>
  <rect x="700" y="150" width="120" height="75" fill="#ffffff" stroke="#c5221f" stroke-width="2"/>
  <text x="712" y="166" font-size="11" fill="#c5221f">N2 : ~1 ha</text>
  <rect x="730" y="176" width="65" height="38" fill="#ffffff" stroke="#188038" stroke-width="2"/>
  <text x="738" y="192" font-size="10" fill="#188038">N1 : ~10 m²</text>
  <text x="755" y="272" font-size="11" fill="#5f6368" text-anchor="middle">interpolation aux 4 coins,</text>
  <text x="755" y="288" font-size="11" fill="#5f6368" text-anchor="middle">MNT à résolution adaptée,</text>
  <text x="755" y="304" font-size="11" fill="#5f6368" text-anchor="middle">divergence nulle garantie</text>
  <text x="755" y="336" font-size="12" fill="#5f6368" text-anchor="middle">chaque niveau affine le précédent</text>
  <g>
    <rect x="30" y="375" width="150" height="46" fill="#e8f0fe" stroke="#4285f4" rx="6"/>
    <text x="105" y="402" font-size="12" fill="#174ea6" text-anchor="middle">MNT + GDAL</text>
    <line x1="180" y1="398" x2="205" y2="398" stroke="#5f6368" stroke-width="2" marker-end="url(#fleche-p)"/>
    <rect x="208" y="375" width="170" height="46" fill="#e8f0fe" stroke="#4285f4" rx="6"/>
    <text x="293" y="394" font-size="12" fill="#174ea6" text-anchor="middle">vent multi-niveaux</text>
    <text x="293" y="410" font-size="11" fill="#174ea6" text-anchor="middle">div. nulle</text>
    <line x1="378" y1="398" x2="403" y2="398" stroke="#5f6368" stroke-width="2" marker-end="url(#fleche-p)"/>
    <rect x="406" y="375" width="150" height="46" fill="#fef7e0" stroke="#f9ab00" rx="6"/>
    <text x="481" y="402" font-size="12" fill="#b06000" text-anchor="middle">τ(x), iso-τ</text>
    <line x1="556" y1="398" x2="581" y2="398" stroke="#5f6368" stroke-width="2" marker-end="url(#fleche-p)"/>
    <rect x="584" y="375" width="160" height="46" fill="#e6f4ea" stroke="#34a853" rx="6"/>
    <text x="664" y="394" font-size="12" fill="#0d652d" text-anchor="middle">C(x) ponctuelle</text>
    <text x="664" y="410" font-size="11" fill="#0d652d" text-anchor="middle">sans EDP ni maillage</text>
    <line x1="744" y1="398" x2="769" y2="398" stroke="#5f6368" stroke-width="2" marker-end="url(#fleche-p)"/>
    <rect x="772" y="375" width="98" height="46" fill="#f1f3f4" stroke="#5f6368" rx="6"/>
    <text x="821" y="402" font-size="12" fill="#202124" text-anchor="middle">QGIS</text>
  </g>
</svg>
