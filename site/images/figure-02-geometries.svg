<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Distance euclidienne et temps de transport dirigé</title>
<desc id="desc">Deux schémas comparant la distance géométrique symétrique au coût longitudinal orienté par un vent uniforme.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="32" y="38" font-size="25" font-weight="bold" fill="#202833">Figure 2 — Deux notions de distance</text>
<line x1="550" y1="65" x2="550" y2="485" stroke="#d5dbe3" stroke-width="2"/>
<text x="34" y="82" font-size="21" font-weight="bold" fill="#202833">A. Distance euclidienne</text>
<text x="34" y="110" font-size="16" font-weight="normal" fill="#202833">Symétrique : dE(A, B) = dE(B, A)</text>
<line x1="130" y1="300" x2="420" y2="190" stroke="#2864a5" stroke-width="4"/>
<circle cx="130" cy="300" r="8" fill="#2864a5"/>
<circle cx="420" cy="190" r="8" fill="#c45132"/>
<text x="108" y="326" font-size="20" font-weight="bold" fill="#202833">A</text>
<text x="430" y="190" font-size="20" font-weight="bold" fill="#202833">B</text>
<text x="200" y="224" font-size="16" font-weight="normal" fill="#202833">segment direct</text>
<text x="34" y="430" font-size="16" font-weight="normal" fill="#202833">La longueur ne dépend pas du sens de parcours.</text>
<text x="580" y="82" font-size="21" font-weight="bold" fill="#202833">B. Coût de migration dirigé</text>
<text x="580" y="110" font-size="16" font-weight="normal" fill="#202833">Vent uniforme vers +x : u = (U, 0), U &gt; 0</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#2c7a55"/></marker></defs>
<line x1="610" y1="155" x2="1010" y2="155" stroke="#2c7a55" stroke-width="3" marker-end="url(#arrow)"/>
<text x="770" y="145" font-size="15" font-weight="normal" fill="#202833">vent</text>
<line x1="650" y1="310" x2="950" y2="310" stroke="#2864a5" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="650" cy="310" r="8" fill="#2864a5"/>
<circle cx="950" cy="245" r="8" fill="#c45132"/>
<line x1="950" y1="245" x2="950" y2="310" stroke="#c45132" stroke-width="2" stroke-dasharray="6 5"/>
<text x="628" y="338" font-size="20" font-weight="bold" fill="#202833">A</text>
<text x="960" y="245" font-size="20" font-weight="bold" fill="#202833">B</text>
<text x="795" y="294" font-size="15" font-weight="normal" fill="#202833">projection B⊥</text>
<text x="665" y="375" font-size="16" font-weight="normal" fill="#202833">τ(A, B) = Δx / U (aval) ; +∞ (amont)</text>
<text x="580" y="411" font-size="15" font-weight="normal" fill="#202833">Le décalage transversal n&#x27;est pas pénalisé dans ce cas jouet.</text>
<text x="580" y="438" font-size="15" font-weight="normal" fill="#202833">Une cible en amont reçoit +∞ selon la convention retenue.</text>
<text x="32" y="487" font-size="13" font-weight="normal" fill="#202833">Schéma original, champ uniforme 2D ; pas une métrique au sens strict ni une reproduction quantitative.</text>
</svg>
