<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">J-DriftX — parcours de lecture en quatre niveaux</title>
<desc id="desc">Infographie en quatre étapes : comprendre le problème physique, comprendre le modèle et ses hypothèses, comprendre les fondements théoriques, puis vérifier et reproduire les résultats. La progression va de l'intuition aux preuves et à l'implémentation.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf6ff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient>
  <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0866ad"/><stop offset=".52" stop-color="#078a83"/><stop offset="1" stop-color="#55a91c"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f4ff"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff9ed"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#123d60" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1686ad"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<path d="M0 180 Q220 130 420 174 T850 165 T1250 150 T1600 165 V0 H0Z" fill="#d8efff"/>
<path d="M0 190 Q240 155 430 190 T850 178 T1260 180 T1600 172" fill="none" stroke="#78bde5" stroke-width="4"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#123d68">
 <text x="72" y="82" font-size="54" font-weight="800">J-DriftX</text>
 <path d="M78 100H1520" stroke="#9bc8df" stroke-width="2"/>
 <text x="78" y="145" font-size="30" font-weight="650">Une documentation structurée pour comprendre, explorer et vérifier</text>
 <text x="1520" y="65" text-anchor="end" font-size="20" font-style="italic" fill="#35688d">Dispersion atmosphérique · recherche ouverte</text>
</g>
<!-- Four reading stages -->
<g filter="url(#shadow)">
 <rect x="55" y="235" width="350" height="480" rx="24" fill="url(#blue)" stroke="#1877b8" stroke-width="3"/>
 <rect x="435" y="235" width="350" height="480" rx="24" fill="url(#green)" stroke="#238d62" stroke-width="3"/>
 <rect x="815" y="235" width="350" height="480" rx="24" fill="url(#blue)" stroke="#1877b8" stroke-width="3"/>
 <rect x="1195" y="235" width="350" height="480" rx="24" fill="url(#green)" stroke="#55a51d" stroke-width="3"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <g><rect x="55" y="235" width="350" height="94" rx="22" fill="#0868ad"/><circle cx="104" cy="282" r="29" fill="#fff"/><text x="104" y="292" font-size="30" text-anchor="middle" font-weight="800" fill="#0868ad">1</text><text x="148" y="278" font-size="27" font-weight="750" fill="#fff">Comprendre</text><text x="148" y="307" font-size="17" fill="#e7f5ff">L'essentiel en quelques minutes</text></g>
 <g><rect x="435" y="235" width="350" height="94" rx="22" fill="#238d62"/><circle cx="484" cy="282" r="29" fill="#fff"/><text x="484" y="292" font-size="30" text-anchor="middle" font-weight="800" fill="#238d62">2</text><text x="528" y="278" font-size="25" font-weight="750" fill="#fff">Comprendre le modèle</text><text x="528" y="307" font-size="17" fill="#eafff2">Concepts et hypothèses</text></g>
 <g><rect x="815" y="235" width="350" height="94" rx="22" fill="#0868ad"/><circle cx="864" cy="282" r="29" fill="#fff"/><text x="864" y="292" font-size="30" text-anchor="middle" font-weight="800" fill="#0868ad">3</text><text x="908" y="278" font-size="25" font-weight="750" fill="#fff">Comprendre la théorie</text><text x="908" y="307" font-size="17" fill="#e7f5ff">Formalisme et dérivations</text></g>
 <g><rect x="1195" y="235" width="350" height="94" rx="22" fill="#55a51d"/><circle cx="1244" cy="282" r="29" fill="#fff"/><text x="1244" y="292" font-size="30" text-anchor="middle" font-weight="800" fill="#55a51d">4</text><text x="1288" y="278" font-size="25" font-weight="750" fill="#fff">Vérifier et reproduire</text><text x="1288" y="307" font-size="17" fill="#f1ffe7">Preuves et implémentation</text></g>
</g>
<!-- Stage 1 physical plume -->
<g transform="translate(85 365)">
 <path d="M10 180H290" stroke="#83b7d2" stroke-width="3"/>
 <path d="M35 175V108H75V175" fill="#a9c5d4" stroke="#477a99" stroke-width="3"/>
 <path d="M46 108V72H64V108" fill="#789cb0"/>
 <path d="M53 70C20 40 85 28 57 2C112 30 79 57 100 66C122 75 105 105 76 105H43C15 98 25 80 53 70Z" fill="#c7d9e5" opacity=".9"/>
 <path d="M105 135C145 108 178 120 212 95C244 74 269 91 287 70" fill="none" stroke="#1686ad" stroke-width="5" stroke-linecap="round"/>
 <path d="M105 145C150 133 183 148 220 124C246 108 269 114 287 104" fill="none" stroke="#55a51d" stroke-width="4" opacity=".8"/>
 <circle cx="160" cy="128" r="9" fill="#1686ad"/><circle cx="224" cy="112" r="7" fill="#55a51d"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#173e63" font-size="22">
 <text x="230" y="585" text-anchor="middle" font-weight="700">Le problème physique</text>
 <text x="230" y="620" text-anchor="middle">Les enjeux et les usages</text>
 <text x="230" y="655" text-anchor="middle">Une vue d'ensemble</text>
</g>
<!-- Stage 2 wind trajectories -->
<g transform="translate(465 385)" fill="none" stroke-linecap="round">
 <path d="M0 25C65 8 118 52 180 24S260 10 295 28" stroke="#1686ad" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M0 70C65 52 118 96 180 68S260 54 295 72" stroke="#1686ad" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M0 115C65 97 118 141 180 113S260 99 295 117" stroke="#1686ad" stroke-width="4" marker-end="url(#arrow)"/>
 <path d="M20 158C75 138 128 165 182 145S248 136 286 145" stroke="#55a51d" stroke-width="5"/>
 <ellipse cx="192" cy="104" rx="72" ry="38" fill="#75d85d" opacity=".2" stroke="#55a51d" stroke-width="2"/>
 <circle cx="55" cy="158" r="10" fill="#0868ad"/><circle cx="253" cy="143" r="10" fill="#0868ad"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#173e63" font-size="22">
 <text x="610" y="585" text-anchor="middle" font-weight="700">Transport et dispersion</text>
 <text x="610" y="620" text-anchor="middle">Temps de transport, τ</text>
 <text x="610" y="655" text-anchor="middle">Hypothèses et domaine de validité</text>
</g>
<!-- Stage 3 mathematical surface -->
<g transform="translate(855 370)">
 <path d="M20 155L145 85L285 130L160 205Z" fill="#d9efff" stroke="#4b98c9" stroke-width="2"/>
 <path d="M20 155L160 205M145 85L285 130M20 155L145 85M160 205L285 130" stroke="#4b98c9" stroke-width="2" fill="none"/>
 <path d="M48 147Q95 95 145 103T255 133Q205 177 160 180T48 147Z" fill="#2da9c8" opacity=".8"/>
 <path d="M80 143Q112 104 153 111T222 135Q184 163 154 162T80 143Z" fill="#8ed14f" opacity=".9"/>
 <path d="M120 140Q145 119 166 124T191 140Q172 154 151 151Z" fill="#f5d34e"/>
 <path d="M20 155L20 225M160 205L160 225M285 130L285 200" stroke="#4b98c9" stroke-dasharray="4 5"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#173e63" font-size="22">
 <text x="990" y="585" text-anchor="middle" font-weight="700">Modèle direct et similitude</text>
 <text x="990" y="620" text-anchor="middle">Géométrie de transport</text>
 <text x="990" y="655" text-anchor="middle">Réduction a priori et dérivations</text>
</g>
<!-- Stage 4 heatmap + code -->
<g transform="translate(1225 380)">
 <rect x="0" y="0" width="165" height="145" rx="8" fill="#e6f4ff" stroke="#4b98c9" stroke-width="2"/>
 <g opacity=".95">
  <ellipse cx="80" cy="72" rx="68" ry="35" fill="#25a9dc" transform="rotate(-25 80 72)"/>
  <ellipse cx="80" cy="72" rx="48" ry="24" fill="#72d44b" transform="rotate(-25 80 72)"/>
  <ellipse cx="80" cy="72" rx="27" ry="14" fill="#ffd34e" transform="rotate(-25 80 72)"/>
  <ellipse cx="80" cy="72" rx="12" ry="7" fill="#ef6b38" transform="rotate(-25 80 72)"/>
 </g>
 <rect x="188" y="15" width="105" height="100" rx="8" fill="#fff" stroke="#4b98c9" stroke-width="3"/>
 <path d="M178 120H304L316 132H166Z" fill="#9db9c9" stroke="#4b98c9" stroke-width="2"/>
 <path d="M220 48L238 65L220 82M260 48L242 65L260 82" fill="none" stroke="#238d62" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#173e63" font-size="22">
 <text x="1370" y="585" text-anchor="middle" font-weight="700">Expériences et benchmarks</text>
 <text x="1370" y="620" text-anchor="middle">Tests, données et preuves</text>
 <text x="1370" y="655" text-anchor="middle">Code et reproductibilité</text>
</g>
<!-- progression arrow -->
<path d="M90 775H1500" stroke="url(#path)" stroke-width="18" stroke-linecap="round" marker-end="url(#arrow)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#123d68" font-weight="700" font-size="22" text-anchor="middle">
 <text x="235" y="825">Intuition physique</text><text x="610" y="825">Concepts</text><text x="990" y="825">Formalisme</text><text x="1370" y="825">Preuves et reproductibilité</text>
</g>
<text x="800" y="875" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#54758d" text-anchor="middle">Parcours indicatif : les quatre niveaux sont des portes d'entrée complémentaires, non une échelle de validation scientifique.</text>
</svg>