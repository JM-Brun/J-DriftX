<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
<title id="title">J-DriftX — quatre portes d'entrée complémentaires</title>
<desc id="desc">Quatre domaines de lecture reliés entre eux : comprendre le problème physique, explorer la chaîne de modélisation, construire la théorie, vérifier et reproduire. Les liens sont transversaux : aucun ordre de lecture ni degré de preuve n'est imposé.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#f7fbf3"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#163b59" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#547d98"/></marker>
</defs>
<rect width="1500" height="820" rx="22" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#153e5c">
  <text x="70" y="75" font-size="43" font-weight="800">J-DriftX — choisir son point d'entrée</text>
  <text x="72" y="116" font-size="22" fill="#45677f">Quatre parcours reliés, à utiliser selon la question du lecteur</text>
</g>
<!-- Non-linear connections, deliberately bidirectional -->
<g fill="none" stroke="#547d98" stroke-width="4" stroke-dasharray="10 9" opacity=".9">
  <path d="M710 300C650 225 560 225 500 300" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M990 300C1050 225 1140 225 1200 300" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M710 565C650 640 560 640 500 565" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M990 565C1050 640 1140 640 1200 565" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M750 350V500" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M930 350V500" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</g>
<g filter="url(#shadow)">
  <rect x="70" y="175" width="560" height="245" rx="24" fill="#fff" stroke="#1475ad" stroke-width="3"/>
  <rect x="870" y="175" width="560" height="245" rx="24" fill="#fff" stroke="#23845f" stroke-width="3"/>
  <rect x="70" y="470" width="560" height="245" rx="24" fill="#fff" stroke="#1475ad" stroke-width="3"/>
  <rect x="870" y="470" width="560" height="245" rx="24" fill="#fff" stroke="#5b9825" stroke-width="3"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <g fill="#0c659e"><circle cx="125" cy="232" r="28"/><text x="125" y="242" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">1</text><text x="172" y="242" font-size="30" font-weight="750">S'orienter et comprendre</text></g>
  <g fill="#1d805b"><circle cx="925" cy="232" r="28"/><text x="925" y="242" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">2</text><text x="972" y="242" font-size="30" font-weight="750">Explorer le modèle</text></g>
  <g fill="#0c659e"><circle cx="125" cy="527" r="28"/><text x="125" y="537" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">3</text><text x="172" y="537" font-size="30" font-weight="750">Construire la théorie</text></g>
  <g fill="#568e21"><circle cx="925" cy="527" r="28"/><text x="925" y="537" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">4</text><text x="972" y="537" font-size="30" font-weight="750">Vérifier et reproduire</text></g>
  <g fill="#244d69" font-size="22">
    <text x="112" y="300" font-weight="700">Problème physique · question de recherche</text>
    <text x="112" y="339">Origine du projet · statut des connaissances</text>
    <text x="112" y="378">Parcours de lecture · glossaire</text>
    <text x="912" y="300" font-weight="700">Vent · transport · dispersion · concentration</text>
    <text x="912" y="339">Chaîne de modélisation N0–N6</text>
    <text x="912" y="378">Laboratoires · exploration interactive</text>
    <text x="112" y="595" font-weight="700">Équations · hypothèses · dérivations</text>
    <text x="112" y="634">Solutions de similitude · réduction a priori</text>
    <text x="112" y="673">Géométrie et temps de transport</text>
    <text x="912" y="595" font-weight="700">Propriétés démontrées ou testées</text>
    <text x="912" y="634">Références · benchmarks · données</text>
    <text x="912" y="673">Limites · reproductibilité · implémentation</text>
  </g>
</g>
<rect x="620" y="365" width="260" height="105" rx="18" fill="#173f5d"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff" text-anchor="middle">
  <text x="750" y="405" font-size="21" font-weight="750">Même projet</text>
  <text x="750" y="436" font-size="17">questions différentes</text>
</g>
<text x="750" y="775" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#45677f">Les liens indiquent des possibilités d'approfondissement, pas une progression obligatoire ni un niveau de preuve.</text>
</svg>