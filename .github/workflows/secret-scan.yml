name: Secret scanning

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --redact --verbose --exit-code=1
