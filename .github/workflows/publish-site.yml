name: Site Quarto (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Installer l'environnement Python et Jupyter
        run: uv sync

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Rendu du site Quarto
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render site

      - name: Vérifier l'explorateur rendu
        run: |
          page="site/_site/projet/experiences-interactives.html"
          test "$(grep -o '<svg' "$page" | wc -l)" -eq 4
          if grep -qiE 'pyodide|Downloading Pyodide' "$page"; then
            echo "::error title=Explorateur statique::le rendu dépend encore de Pyodide"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
