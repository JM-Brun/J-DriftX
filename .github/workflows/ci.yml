name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Installer l'environnement
        run: uv sync

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43

      - name: Rendu du site Quarto
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render site

      - name: Vérifier l'explorateur rendu
        run: |
          page="site/_site/projet/experiences-interactives.html"
          test "$(grep -o '<svg' "$page" | wc -l)" -eq 4
          if grep -qiE 'pyodide|Downloading Pyodide' "$page"; then
            echo "::error title=Explorateur statique::le rendu dépend encore de Pyodide"
            exit 1
          fi

      - name: Lint (ruff)
        run: uv run ruff check . --output-format=github

      - name: Format (ruff)
        run: |
          if ! uv run ruff format --check .; then
            echo "::error title=Format ruff::$(uv run ruff format --check . 2>&1 | tr '\n' ' ')"
            exit 1
          fi

      - name: Typage (mypy)
        run: |
          if ! uv run mypy; then
            echo "::error title=mypy::$(uv run mypy 2>&1 | tr '\n' ' ' | head -c 3000)"
            exit 1
          fi

      - name: Tests (pytest)
        run: |
          uv run pytest --cov=jdriftx --cov-report=term-missing --cov-fail-under=91 2>&1 | tee pytest-output.txt
          code=${PIPESTATUS[0]}
          echo "::notice title=Couverture totale::$(grep TOTAL pytest-output.txt | tail -n 1 | awk '{print $4}')"
          if [ "$code" -ne 0 ]; then
            echo "::error title=pytest (exit $code)::$(tail -n 80 pytest-output.txt | tr '\n' ' ' | head -c 2500)"
            exit 1
          fi
