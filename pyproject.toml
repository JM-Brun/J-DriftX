[project]
name = "jdriftx"
version = "0.1.0"
description = "Reprise de recherche sur les modèles de dispersion à complexité réduite et les formulations historiques de temps de transport de Drift-X"
readme = "README.md"
authors = [{ name = "Jean-Marc Brun" }]
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=2.0", "pydantic>=2.9"]
keywords = [
  "atmospheric-dispersion",
  "reduced-order-modelling",
  "spray-drift",
  "similitude",
  "data-assimilation",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "jupyter>=1.0",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "hypothesis>=6.115",
]

app = [
  "plotly>=5.24",
  "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdriftx"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff specifique
  "D",        # pydocstyle
  "PT",       # pytest
  "ANN",      # annotations
  "S",        # bandit (securite)
  "PL",       # pylint
]
# PLR0913 (too many arguments) et PLR0917 (too many positional arguments) :
# signatures physiques (x, y, z, debit, u, classe, hauteur) ou le nombre
# d'arguments positionnels est une convention du domaine, pas un defaut.
ignore = [
  "D203",
  "D213",
  "ANN401",
  "PLR0913",
  "PLR0917",
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# Tests : asserts autorises (S101), docstrings et annotations assouplies,
# style pytest tolere (PT001).
"tests/**" = ["S101", "D", "ANN", "PT001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["jdriftx", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
