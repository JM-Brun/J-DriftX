[project]
name = "jdriftx"
version = "0.1.0"
description = "Dispersion atmospherique a complexite reduite : solutions de similitude generalisees dans une metrique non symetrique de temps de transport (reprise open-source de Drift-X)"
readme = "README.md"
authors = [{ name = "Jean-Marc Brun" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]
keywords = [
  "atmospheric-dispersion",
  "reduced-order-modelling",
  "spray-drift",
  "similitude",
  "data-assimilation",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jdriftx"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "C4",       # comprehensions
  "SIM",      # simplify
  "RUF",      # ruff specifique
  "D",        # pydocstyle
  "PT",       # pytest
  "ANN",      # annotations
  "S",        # bandit (securite)
  "PL",       # pylint
]
ignore = ["D203", "D213", "ANN401", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Tests : asserts autorises (S101), docstrings et annotations assouplies,
# style pytest tolere (PT001).
"tests/**" = ["S101", "D", "ANN", "PT001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
